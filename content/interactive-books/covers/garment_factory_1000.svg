<text x="105" y="285" fill="#fff" font-family="'Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-weight="900" font-size="63">中文1000句</text>
<text x="108" y="329" fill="#e6d7ac" font-family="Arial,sans-serif" font-size="19" letter-spacing="2">PRACTICAL SPOKEN CHINESE</text>
