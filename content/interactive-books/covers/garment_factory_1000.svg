<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800" role="img" aria-labelledby="title desc">
<title id="title">服装厂中文1000句 封面</title>
<desc id="desc">深绿色封面，中央用浅色线条画出缝纫机与布料，适合服装厂中文口语课程。</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#0a4445"/><stop offset="65%" stop-color="#155e60"/><stop offset="100%" stop-color="#27776b"/>
  </linearGradient>
  <linearGradient id="art" x1="0" x2="1" y1="0" y2="1">
    <stop offset="0%" stop-color="#d9e6cf"/><stop offset="100%" stop-color="#f1dfbb"/>
  </linearGradient>
  <pattern id="grain" patternUnits="userSpaceOnUse" width="18" height="18">
    <circle cx="1.5" cy="1.5" r="1" fill="#fff" fill-opacity=".08"/>
  </pattern>
</defs>
<rect width="600" height="800" rx="12" fill="url(#bg)"/>
<rect width="600" height="800" fill="url(#grain)"/>
<path d="M43 0h16v800H43z" fill="#e3ca99" opacity=".68"/>
<path d="M66 0h2v800h-2z" fill="#dbe9e7" opacity=".55"/>
