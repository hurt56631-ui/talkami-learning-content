name: Dispatch practical-4500 release v1.6.40 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dispatch-practical-4500-release-once.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch-official-publisher:
    if: github.repository == 'hurt56631-ui/talkami-learning-content'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start official Publish learning content workflow with a new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view content-v1.6.40 >/dev/null 2>&1; then
            echo 'content-v1.6.40 already exists, nothing to dispatch'
            exit 0
          fi
          gh workflow run publish-learning-content.yml --ref main -f version=1.6.40
          echo 'Requested the existing official publishing workflow for content-v1.6.40'
