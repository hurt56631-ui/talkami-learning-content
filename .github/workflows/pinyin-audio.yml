name: Prepare and publish Pinyin audio

on:
  workflow_dispatch:
    inputs:
      action:
        description: "先 prepare_releases；音频上传完以后再运行 import_and_publish"
        required: true
        type: choice
        options:
          - prepare_releases
          - import_and_publish
      version:
        description: "拼音资源版本，例如 1；发布成功后不要复用同一版本"
        required: true
        default: "1"
        type: string
      part_count:
        description: "Release 分几批"
        required: true
        default: "3"
        type: choice
        options:
          - "3"
          - "2"
      expected_count:
        description: "应该上传的音频总数"
        required: true
        default: "1338"
        type: string

permissions:
  contents: write

concurrency:
  group: pinyin-audio-publish
  cancel-in-progress: false

jobs:
  pinyin:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Validate inputs
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PART_COUNT: ${{ inputs.part_count }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9A-Za-z._-]+$ ]] || { echo "Invalid version"; exit 1; }
          [[ "$PART_COUNT" == "2" || "$PART_COUNT" == "3" ]] || { echo "part_count must be 2 or 3"; exit 1; }
          [[ "$EXPECTED_COUNT" =~ ^[0-9]+$ ]] || { echo "expected_count must be an integer"; exit 1; }

      - name: Prepare empty upload Releases
        if: ${{ inputs.action == 'prepare_releases' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PART_COUNT: ${{ inputs.part_count }}
        run: |
          set -euo pipefail
          for i in $(seq 1 "$PART_COUNT"); do
            TAG="pinyin-audio-v${VERSION}-part${i}"
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "$TAG already exists"
            else
              gh release create "$TAG" \
                --title "Talkami Pinyin audio v${VERSION} part ${i}/${PART_COUNT}" \
                --notes "Upload only Pinyin audio files here. Keep this part under 900 assets. After all parts are uploaded, run this workflow again with action=import_and_publish."
              echo "Created $TAG"
            fi
          done

      - name: Download uploaded Release assets
        if: ${{ inputs.action == 'import_and_publish' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PART_COUNT: ${{ inputs.part_count }}
        run: |
          set -euo pipefail
          rm -rf .pinyin-release-staging
          mkdir -p .pinyin-release-staging

          for i in $(seq 1 "$PART_COUNT"); do
            TAG="pinyin-audio-v${VERSION}-part${i}"
            DIR=".pinyin-release-staging/part${i}"
            mkdir -p "$DIR"
            gh release view "$TAG" >/dev/null
            gh release download "$TAG" --dir "$DIR"
            COUNT=$(find "$DIR" -maxdepth 1 -type f | wc -l | tr -d ' ')
            echo "$TAG: downloaded $COUNT asset(s)"
          done

      - name: Import audio and build browser manifest
        if: ${{ inputs.action == 'import_and_publish' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          PART_COUNT: ${{ inputs.part_count }}
          EXPECTED_COUNT: ${{ inputs.expected_count }}
        run: |
          set -euo pipefail
          python3 scripts/import_pinyin_releases.py \
            --version "$VERSION" \
            --parts "$PART_COUNT" \
            --expected "$EXPECTED_COUNT"

      - name: Commit versioned audio and manifest
        if: ${{ inputs.action == 'import_and_publish' }}
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "audio/pinyin/v${VERSION}" manifests/pinyin/pinyin-manifest.json
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi

          git commit -m "Publish Pinyin audio v${VERSION}"
          git push
