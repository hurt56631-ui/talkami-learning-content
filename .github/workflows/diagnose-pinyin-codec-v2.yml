name: Diagnose Pinyin Audio v2

on:
  push:
    paths:
      - '.github/workflows/diagnose-pinyin-codec-v2.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Inspect all pinyin audio
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import collections
          import json
          import pathlib
          import subprocess

          files = sorted(pathlib.Path('audio/pinyin').rglob('*.mp3'))
          bad = []
          codecs = collections.Counter()
          rates = collections.Counter()
          channels = collections.Counter()
          formats = collections.Counter()

          for path in files:
              result = subprocess.run([
                  'ffprobe', '-v', 'error',
                  '-show_entries', 'format=format_name:stream=codec_name,codec_type,sample_rate,channels',
                  '-of', 'json', str(path),
              ], text=True, capture_output=True)
              if result.returncode:
                  bad.append((str(path), result.stderr.strip()))
                  continue
              data = json.loads(result.stdout)
              formats[data.get('format', {}).get('format_name', '?')] += 1
              streams = [s for s in data.get('streams', []) if s.get('codec_type') == 'audio']
              if not streams:
                  bad.append((str(path), 'no audio stream'))
                  continue
              stream = streams[0]
              codecs[stream.get('codec_name', '?')] += 1
              rates[stream.get('sample_rate', '?')] += 1
              channels[str(stream.get('channels', '?'))] += 1

          print('FILES', len(files))
          print('FORMATS', dict(formats))
          print('CODECS', dict(codecs))
          print('SAMPLE_RATES', dict(rates))
          print('CHANNELS', dict(channels))
          print('BAD_COUNT', len(bad))
          for path, error in bad:
              print('BAD', path, '::', error)

          if len(files) != 223:
              raise SystemExit(f'expected 223 files, got {len(files)}')
          if bad:
              raise SystemExit(f'{len(bad)} audio files failed ffprobe')
          PY
